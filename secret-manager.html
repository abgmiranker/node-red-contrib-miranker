// API Configuration Node HTML
<script type="text/javascript">
    function updateFieldStates(envData) {
        const envField = $("#node-config-input-environment");
        const locField = $("#node-config-input-location");
        const envNote = $("#secrets-environment-note");
        const locNote = $("#loc-environment-note");
        const showDevOnly = $(".show-dev-only, .show-dev-only > * ");
        const hideDevOnly = $(".hide-dev-only, .hide-dev-only > *");
        const enableDevOnly = $(".enable-dev-only, .enable-dev-only > *");
        const disableDevOnly = $(".disable-dev-only, .disable-dev-only > *");
        
        if (envData?.NODE_ENV==="dev") {
            showDevOnly.prop('hidden', false)
            hideDevOnly.prop('hidden', true)
            enableDevOnly.prop('disabled', false)
                .css({
                    'background-color': '',
                    'color': '',
                    'cursor': ''
            });
            disableDevOnly.prop('disabled', true)
                .css({
                    'background-color': '#f0f0f0',
                    'color': '#999',
                    'cursor': 'not-allowed'
            });
        } else {
            showDevOnly.prop('hidden', true)
            hideDevOnly.prop('hidden', false)
            enableDevOnly.prop('disabled', true)
                .css({
                    'background-color': '#f0f0f0',
                    'color': '#999',
                    'cursor': 'not-allowed'
            });
            disableDevOnly.prop('disabled', false)
                .css({
                    'background-color': '',
                    'color': '',
                    'cursor': ''
            });
        }

        if (envData?.NODE_ENV==="dev") {
            envField.css({
                        'background-color': '',
                        'color': '',
                        'cursor': ''
                    });
            envNote.html('<i class="fa fa-info-circle"></i> If ENV environment variable is set, it will override this value when NODE_ENV != \"dev\"')
                    .css({'color': '#666', 'font-weight': 'normal'});
        } else {
            envField.css({
                        'background-color': '#f0f0f0',
                        'color': '#999',
                        'cursor': 'not-allowed'
                    });
            envNote.html(`<i class="fa fa-lock" style="color: #999;"></i> <strong>Overridden by environment: ${envData.ENV}</strong>`)
                    .css({'color': '#999', 'font-weight': 'bold'});
        }
        
        // Handle Unlucky Number field
        if (envData?.NODE_ENV==="dev") {
            locField.css({
                        'background-color': '',
                        'color': '',
                        'cursor': ''
                    });
            locNote.html('<i class="fa fa-info-circle"></i> If LOC environment variable is set, it will override this value when NODE_ENV != \"dev\" ')
                    .css({'color': '#666', 'font-weight': 'normal'});
            
        } else {
            locField.css({
                        'background-color': '#f0f0f0',
                        'color': '#999',
                        'cursor': 'not-allowed'
                    });
            locNote.html(`<i class="fa fa-lock" style="color: #999;"></i> <strong>Overridden by environment: ${envData.LOC}</strong>`)
                    .css({'color': '#999', 'font-weight': 'bold'});

        }
    }

    
    RED.nodes.registerType("secret-manager", {
        category: "config",
        defaults: {
            name: { value: "" },
            environment: { value: "prod" },
            location: { value: "amer" },
            source: { value:"environment" }
        },
        credentials: {
            secretUrl: { value: "" },
            secretRule: { value: "" },
            secretKey: { value: false },
            secretName: { value: "" },
            identityUrl: { value: "" },
        },
        label: function () {
            return this.name || "Secret Manager";
        },
        exportable: true,
        oneditprepare: function () {
            // console.log("Config Opened");
            // Additional UI setup if needed
            $("#node-config-input-source").typedInput({
                types: [
                    {
                        value: "source",
                        options: [
                            { value: "environment", label: "Environment"},
                            { value: "manual", label: "Manual"},
                        ]
                    }
                ]
            })

            $("#node-config-input-source").on("change", function () {
                const src = $(this).val();
                console.log(`Selected Env: ${src}`);
                if (src === "environment") {
                    $(".manual-entry").hide();
                    console.log("Disabling env, loc");
                    $("#node-config-input-environment").prop('disabled', true)
                    $("#node-config-input-location").prop('disabled', true)
                } else {
                    $(".manual-entry").show();
                    console.log("Enabling env, loc");
                    $("#node-config-input-environment").prop('disabled', false)
                    $("#node-config-input-location").prop('disabled', false)
                }
            })
            
            $("#node-config-input-environment").on("change", function () {
                const src = $("#node-config-input-source").val();
                const env = $(this).val();
                console.log(`Selected Env: ${env}`);
            });

            $("#node-config-input-location").on("change", function () {
                const src = $("#node-config-input-source").val();
                const loc = $(this).val();
                console.log(`Selected Loc: ${loc}`);
            });
            
            $.getJSON('/node-env', function(resp) {
                updateFieldStates(resp);
                const src = $("#node-config-input-source").val();
                if(src==="environment" || resp.NODE_ENV!=="dev"){
                    $("#node-config-input-environment").val(resp.ENV)
                    $("#node-config-input-location").val(resp.LOC)
                    $("#node-config-input-environment").prop('disabled', true)
                    $("#node-config-input-location").prop('disabled', true)
                } else {
                    $("#node-config-input-environment").prop('disabled', false)
                    $("#node-config-input-location").prop('disabled', false)
                }
            }).fail(function() {
                console.warn('Could not check environment variables');
            });

            $("#node-config-input-source").trigger("change")
            $("#node-config-input-environment").trigger("change");
            $("#node-config-input-location").trigger("change");
        },
        oneditsave: function() {
            console.log("Config Saved");
        }
    });
</script>

<script type="text/html" data-template-name="secret-manager">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Name" />
    </div>

    <div class="form-tips hide-dev-only" style="margin-top: 5px; color: #666; font-size: 12px;">
        <i class="fa fa-info-circle"></i> <em>Prod Mode:</em> Manual configuration disabled. Using environment variables
    </div>
    <div class="form-tips show-dev-only" style="margin-top: 5px; color: #666; font-size: 12px;">
        <i class="fa fa-info-circle"></i> <em>Dev Mode:</em> Manual entry of secrets permitted
    </div>
        <div class="form-row enable-dev-only">
        <label for="node-config-input-environment" class="col-sm-6" style="width:40%"><i class="fa fa-globe"></i> Environment</label>
        <select id="node-config-input-environment" class="col-sm-auto float-left" style="width:auto">
            <option value="sit">SIT</option>
            <option value="staging">STAGING</option>
            <option value="qe">QE</option>
            <option value="prod">PROD</option>
        </select>
        <!-- <div class="form-tips hide-dev-only" id="secrets-environment-note" style="margin-top: 5px; color: #666; font-size: 12px;">
            <i class="fa fa-info-circle"></i> If ENV environment variable is set, it will override this value
        </div> -->
    </div>
    <div class="form-row enable-dev-only">
        <label for="node-config-input-location" class="col-sm-6" style="width:40%"><i class="fa fa-map-marker"></i> Location</label>
        <select id="node-config-input-location" class="col-sm-auto float-left" style="width:auto">
            <option value="amer">amer</option>
            <option value="emea">emea</option>
        </select>
        <!-- <div class="form-tips hide-dev-only" id="loc-environment-note" style="margin-top: 5px; color: #666; font-size: 12px;">
            <i class="fa fa-info-circle"></i> If LOC environment variable is set, it will override this value
        </div> -->
    </div>
    <div class="form-row enable-dev-only">
        <label for="node-config-input-source" class="col-sm-6" style="width:40%"><i class="fa fa-map-marker"></i> Credential Source</label>
        <input type="text" id="node-config-input-source" class="col-sm-auto float-left" style="width:auto"/>
    </div>
    <div class="form-row show-dev-only manual-entry">
        <label for="node-config-input-secretUrl"><i class="fa fa-lock"></i> Secret Server URL</label>
        <input type="text" id="node-config-input-secretUrl" placeholder="https://protolabs.secretservercloud.com"/>
    </div>
    <div class="form-row show-dev-only manual-entry">
        <label for="node-config-input-identityUrl"><i class="fa fa-id-card"></i> Identity URL</label>
        <input type="text" id="node-config-input-identityUrl" placeholder="${URI_IDENTITY_INTERNAL}"/>
    </div>
    <div class="form-row show-dev-only manual-entry">
        <label for="node-config-input-secretName"><i class="fa fa-key"></i> Secret Name</label>
        <input type="text" id="node-config-input-secretName" placeholder="${THYCOTIC_SECRET_NAME}"/>
    </div>
    <div class="form-row show-dev-only manual-entry">
        <label for="node-config-input-secretRule"><i class="fa fa-key"></i> Secret Rule</label>
        <input type="text" id="node-config-input-secretRule" placeholder="${THYCOTIC_RULE}"/>
    </div>
    <div class="form-row show-dev-only manual-entry">
        <label for="node-config-input-secretKey"><i class="fa fa-key"></i> Secret Key</label>
        <input type="text" id="node-config-input-secretKey" placeholder="${THYCOTIC_KEY}"/>
    </div>
</script>

<script type="text/html" data-help-name="secret-manager">
    <p>A configuration node for company API credentials.</p>
    <p>
        This node manages the SDK account creation, token acquisition, and
        renewal for API access.
    </p>
    <h3>Details</h3>
    <ul>
        <li><b>Name:</b> A name for this configuration</li>
        <li><b>Environment:</b> API environment (e.g., sit, uat, prod)</li>
        <li><b>Location:</b> API location (e.g., amer, emea, global)</li>
        <li>
            <b>Secret Server URL:</b> The URL of the secret server (e.g.,
            https://protolabs.secretservercloud.com)
        </li>
        <li><b>Secret Rule:</b> The rule name for SDK account creation</li>
        <li><b>Secret Key:</b> The onboarding key for SDK account creation</li>
        <li>
            <b>Identity URL:</b> The URL for the identity service that provides
            JWT tokens
        </li>
        <li>
            <b>Client UUID:</b> Optional client UUID (will be auto-generated if
            not provided)
        </li>
    </ul>
    <p>Authentication flow:</p>
    <ol>
        <li>Creates an SDK account with the secret server</li>
        <li>Obtains client credentials from the SDK account</li>
        <li>
            Uses these credentials to request a JWT from the identity service
        </li>
        <li>Automatically refreshes tokens when needed</li>
        <li>Properly cleans up by revoking the SDK account on shutdown</li>
    </ol>
</script>
